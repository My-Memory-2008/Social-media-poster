name: Post to Social Media

on:
  workflow_dispatch:
    inputs:
      seo_file:
        description: 'Path to SEO results file'
        required: false
        type: string
        default: 'seo-results/seo_latest.json'
      platforms:
        description: 'Comma-separated platforms (pinterest,twitter,instagram,youtube,tiktok)'
        required: true
        type: string
        default: 'pinterest'

jobs:
  post-social:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Post to selected platforms
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          SEO_FILE: ${{ github.event.inputs.seo_file || 'seo-results/seo_latest.json' }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'pinterest' }}
        run: |
          echo "Posting to platforms: $PLATFORMS"
          echo "Pinterest Board ID configured: $([ -n '$PINTEREST_BOARD_ID' ] && echo 'Yes' || echo 'No')"
          python scripts/post-social.py
          
      - name: Upload posting results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posting-results
          path: posting-results.json
