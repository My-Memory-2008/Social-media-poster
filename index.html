<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Dashboard</title>
  <style>
    :root {
      --primary: #0070f3;
      --primary-hover: #0051cb;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e1e4e8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .panel {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }
    .group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    textarea {
      width: 100%; height: 120px; padding: 12px; box-sizing: border-box;
      border: 1px solid var(--border); border-radius: 6px; font-size: 14px; resize: vertical; outline: none;
    }
    input[type="url"] {
      width: 100%; padding: 10px; box-sizing: border-box;
      border: 1px solid var(--border); border-radius: 6px; outline: none;
    }
    textarea:focus, input:focus { border-color: var(--primary); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .option {
      display: flex; align-items: center; padding: 10px;
      border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .option input { margin-right: 10px; }
    .btn {
      background-color: var(--primary); color: white; border: none; padding: 14px;
      font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px;
    }
    .btn:hover { background-color: var(--primary-hover); }
  </style>
</head>
<body>

<div class="panel">
  <h2 style="margin: 0 0 20px 0;">📣 Multi-Platform Broadcast</h2>
  
  <div class="group">
    <label for="postText">Message Content</label>
    <textarea id="postText" placeholder="What are we sharing with the world?"></textarea>
  </div>

  <div class="group">
    <label>Publish Channels</label>
    <div class="grid">
      <label class="option"><input type="checkbox" value="twitter" class="channel"> X / Twitter</label>
      <label class="option"><input type="checkbox" value="linkedin" class="channel"> LinkedIn</label>
      <label class="option"><input type="checkbox" value="reddit" class="channel"> Reddit</label>
      <label class="option"><input type="checkbox" value="pinterest" class="channel"> Pinterest</label>
    </div>
  </div>

  <div class="group">
    <label for="mediaUrl">Attachment URL (Required for Pinterest)</label>
    <input type="url" id="mediaUrl" placeholder="https://example.com">
  </div>

  <button class="btn" onclick="broadcastPost()">Publish Now</button>
</div>

<script>
  async function broadcastPost() {
    const text = document.getElementById('postText').value.trim();
    const mediaUrl = document.getElementById('mediaUrl').value.trim();
    const platforms = Array.from(document.querySelectorAll('.channel:checked')).map(el => el.value);

    if (!text || platforms.length === 0) {
      alert("Please write your update and select at least one network.");
      return;
    }

    try {
      const response = await fetch('/api/schedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, platforms, mediaUrl })
      });

      if (response.ok) {
        alert("Broadcast successfully dispatched to GitHub Actions!");
        document.getElementById('postText').value = '';
        document.getElementById('mediaUrl').value = '';
        document.querySelectorAll('.channel').forEach(el => el.checked = false);
      } else {
        alert("Server failed to route command: " + await response.text());
      }
    } catch (err) {
      alert("Network Error: " + err.message);
    }
  }
</script>
</body>
</html>
