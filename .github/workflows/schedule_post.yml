name: Publish Scheduled Social Media Post

on:
  repository_dispatch:
    types: [schedule_post]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20

      - name: Install Dependencies
        run: npm install @actions/core node-fetch

      - name: Handle Scheduled Delay
        run: |
          # Calculate how many seconds we need to wait before posting
          DELAY_SECONDS=${{ github.event.client_payload.delay_seconds }}
          if [ "$DELAY_SECONDS" -gt 0 ]; then
            echo "Waiting for $DELAY_SECONDS seconds before publishing..."
            sleep $DELAY_SECONDS
          fi

      - name: Run Publisher Script
        env:
          # Pass social media tokens securely from GitHub Repository Secrets
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}
          REDDIT_TOKEN: ${{ secrets.REDDIT_TOKEN }}
          REDDIT_SUBREDDIT: ${{ secrets.REDDIT_SUBREDDIT }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          
          # Pass the actual user post payload from the website interface
          POST_TEXT: ${{ github.event.client_payload.text }}
          POST_PLATFORMS: ${{ toJson(github.event.client_payload.platforms) }}
          MEDIA_URL: ${{ github.event.client_payload.media_url }}
        run: node scripts/publish.js
