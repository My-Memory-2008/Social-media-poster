<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pure Social Hub</title>
  <style>
    :root {
      --primary: #0070f3;
      --primary-hover: #0051cb;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
      --text-muted: #666666;
      --border: #e1e4e8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg); color: var(--text);
      margin: 0; padding: 40px 20px;
      display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;
    }
    .panel {
      background: var(--card-bg); width: 100%; max-width: 600px; padding: 30px;
      border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border);
    }
    .config-box {
      background: #fafbfc; border: 1px solid var(--border); border-radius: 8px;
      padding: 15px; margin-bottom: 20px; font-size: 13px;
    }
    .config-box input {
      width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px;
      box-sizing: border-box; border: 1px solid var(--border); border-radius: 4px;
    }
    .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 20px; }
    .tab {
      flex: 1; text-align: center; padding: 12px; cursor: pointer;
      font-weight: 600; color: var(--text-muted); transition: all 0.2s;
    }
    .tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); margin-bottom: -2px; }
    .group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    textarea {
      width: 100%; height: 100px; padding: 12px; box-sizing: border-box;
      border: 1px solid var(--border); border-radius: 6px; font-size: 14px; resize: vertical; outline: none;
    }
    textarea:focus { border-color: var(--primary); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .option {
      display: flex; align-items: center; padding: 10px;
      border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 14px; background: white;
    }
    .option input { margin-right: 10px; }
    .drop-zone {
      border: 2px dashed var(--border); border-radius: 8px; padding: 30px;
      text-align: center; background: #fafbfc; cursor: pointer; transition: all 0.2s;
    }
    .drop-zone.hover { border-color: var(--primary); background: #f0f7ff; }
    .drop-zone p { margin: 0 0 10px 0; font-size: 14px; color: var(--text-muted); }
    .file-input { display: none; }
    .preview-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
    .preview-item {
      position: relative; aspect-ratio: 1; border-radius: 6px;
      overflow: hidden; border: 1px solid var(--border); background: #eee;
    }
    .preview-item img, .preview-item video { width: 100%; height: 100%; object-fit: cover; }
    .btn {
      background-color: var(--primary); color: white; border: none; padding: 14px;
      font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .status-lbl { font-size: 12px; font-weight: bold; color: var(--primary); margin-top: 5px; display: block; }
  </style>
</head>
<body>

<div class="panel">
  <h2 style="margin: 0 0 5px 0;">📣 Pure GitHub Cross-Poster</h2>
  <span style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:15px;">Local browser engine - Zero server storage configuration.</span>

  <!-- Local Encryption Setup panel -->
  <div class="config-box">
    <label style="font-size:12px; margin-bottom:2px;">🛠️ GitHub Configuration Connection (Stored locally in your browser)</label>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
      <input type="text" id="ghOwner" placeholder="GitHub Username" onchange="saveConfig()">
      <input type="text" id="ghRepo" placeholder="Repository Name" onchange="saveConfig()">
    </div>
    <input type="password" id="ghPat" placeholder="Paste GitHub Personal Access Token (PAT)" onchange="saveConfig()">
  </div>
  
  <div class="tabs">
    <div class="tab active" id="imgTabBtn" onclick="switchTab('image-tab')">🖼️ Multi-Image Post</div>
    <div class="tab" id="vidTabBtn" onclick="switchTab('video-tab')">🎬 Single Video Post</div>
  </div>
  
  <div class="group">
    <label for="postText">Message Idea Content</label>
    <textarea id="postText" placeholder="What are we sharing with the world today?"></textarea>
  </div>

  <div class="group">
    <label>Publish Channels</label>
    <div class="grid">
      <label class="option"><input type="checkbox" value="twitter" class="channel"> X / Twitter</label>
      <label class="option"><input type="checkbox" value="linkedin" class="channel"> LinkedIn</label>
      <label class="option"><input type="checkbox" value="reddit" class="channel"> Reddit</label>
      <label class="option"><input type="checkbox" value="pinterest" class="channel"> Pinterest</label>
    </div>
  </div>

  <!-- Images Section -->
  <div id="image-tab" class="tab-content">
    <div class="group">
      <label>Bulk Image Assets (Max 20)</label>
      <div class="drop-zone" id="imageDropZone" onclick="document.getElementById('imageFiles').click()">
        <p>Drag & drop images here, or <b>browse</b></p>
        <input type="file" id="imageFiles" class="file-input" accept="image/*" multiple>
      </div>
      <div class="preview-list" id="imagePreviews"></div>
    </div>
  </div>

  <!-- Video Section -->
  <div id="video-tab" class="tab-content" style="display:none;">
    <div class="group">
      <label>Video File Asset</label>
      <div class="drop-zone" id="videoDropZone" onclick="document.getElementById('videoFile').click()">
        <p>Drag & drop a video file here, or <b>browse</b></p>
        <input type="file" id="videoFile" class="file-input" accept="video/*">
      </div>
      <div class="preview-list" id="videoPreviews"></div>
    </div>
  </div>

  <button class="btn" id="submitBtn" onclick="broadcastPost()">Publish Now</button>
  <span id="statusMessage" class="status-lbl" style="display:none;">Packing local file chunks into Base64 payload...</span>
</div>



<script>
  let activeTab = 'image-tab';
  let memoryImages = []; 
  let memoryVideo = null;

  // Auto-restore configuration parameters from local browser memory on load
  window.addEventListener('DOMContentLoaded', () => {
    if(localStorage.getItem('gh_owner')) document.getElementById('ghOwner').value = localStorage.getItem('gh_owner');
    if(localStorage.getItem('gh_repo')) document.getElementById('ghRepo').value = localStorage.getItem('gh_repo');
    if(localStorage.getItem('gh_pat')) document.getElementById('ghPat').value = localStorage.getItem('gh_pat');
  });

  function saveConfig() {
    localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim());
    localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
    localStorage.setItem('gh_pat', document.getElementById('ghPat').value.trim());
  }

  function switchTab(tabId) {
    activeTab = tabId;
    document.getElementById('imgTabBtn').classList.toggle('active', tabId === 'image-tab');
    document.getElementById('vidTabBtn').classList.toggle('active', tabId === 'video-tab');
    document.getElementById('image-tab').style.display = tabId === 'image-tab' ? 'block' : 'none';
    document.getElementById('video-tab').style.display = tabId === 'video-tab' ? 'block' : 'none';
  }

  setupDropZone('imageDropZone', 'imageFiles', handleImageFiles);
  setupDropZone('videoDropZone', 'videoFile', handleVideoFile);

  function setupDropZone(zoneId, inputId, uploadHandler) {
    const zone = document.getElementById(zoneId);
    const input = document.getElementById(inputId);
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('hover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('hover'));
    zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('hover'); uploadHandler(e.dataTransfer.files); });
    input.addEventListener('change', () => { uploadHandler(input.files); });
  }

  function getBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve({ name: file.name, data: reader.result.split(',')[1] });
      reader.onerror = error => reject(error);
    });
  }

  async function handleImageFiles(files) {
    const container = document.getElementById('imagePreviews');
    for (let file of Array.from(files).slice(0, 20)) {
      const item = document.createElement('div');
      item.className = 'preview-item';
      item.innerHTML = `<img>`;
      item.querySelector('img').src = URL.createObjectURL(file);
      container.appendChild(item);
      
      const b64 = await getBase64(file);
      memoryImages.push(b64);
    }
  }

  async function handleVideoFile(files) {
    const container = document.getElementById('videoPreviews');
    container.innerHTML = ''; 
    const file = files[0];
    if (!file) return;

    const item = document.createElement('div');
    item.className = 'preview-item';
    item.innerHTML = `<video muted loop autoplay></video>`;
    item.querySelector('video').src = URL.createObjectURL(file);
    container.appendChild(item);

    memoryVideo = await getBase64(file);
  }

  async function broadcastPost() {
    const text = document.getElementById('postText').value.trim();
    const platforms = Array.from(document.querySelectorAll('.channel:checked')).map(el => el.value);
    
    // Read local browser execution context variables
    const REPO_OWNER = document.getElementById('ghOwner').value.trim();
    const REPO_NAME = document.getElementById('ghRepo').value.trim();
    const GITHUB_PAT = document.getElementById('ghPat').value.trim();

    if (!REPO_OWNER || !REPO_NAME || !GITHUB_PAT) {
      alert("Please enter your GitHub Username, Repository Name, and Personal Access Token in the top configuration box.");
      return;
    }
    if (!text || platforms.length === 0) {
      alert("Please write a text description and select target publish channels.");
      return;
    }

    document.getElementById('statusMessage').style.display = 'block';
    document.getElementById('submitBtn').disabled = true;

    const activeFiles = activeTab === 'image-tab' ? memoryImages : (memoryVideo ? [memoryVideo] : []);

    const payload = {
      event_type: "instant_post",
      client_payload: {
        text: text,
        platforms: platforms,
        mediaType: activeTab === 'image-tab' ? 'images' : 'video',
        files: activeFiles 
      }
    };

    try {
      // Direct REST communication dispatch using standard cross-origin token parameters
      const response = await fetch(`https://github.com{REPO_OWNER}/${REPO_NAME}/dispatches`, {
        method: 'POST',
        mode: 'cors', // Explicitly negotiate CORS handshakes safely with api.github.com
        headers: {
          'Authorization': `token ${GITHUB_PAT}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      if (response.status === 204) {
        alert("Broadcast successfully dispatched to GitHub Actions engine!");
        document.getElementById('postText').value = '';
        document.getElementById('imagePreviews').innerHTML = '';
        document.getElementById('videoPreviews').innerHTML = '';
        memoryImages = [];
        memoryVideo = null;
      } else {
        alert(`GitHub API Error (${response.status}): ` + await response.text());
      }
    } catch (err) {
      alert("Execution Error: Direct browser context was blocked. Ensure your PAT string has correct permissions. Details: " + err.message);
    } finally {
      document.getElementById('statusMessage').style.display = 'none';
      document.getElementById('submitBtn').disabled = false;
    }
  }
</script>
</body>
</html>
