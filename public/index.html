<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unified Social Media Scheduler</title>
  <style>
    :root {
      --primary: #0070f3;
      --primary-hover: #0051cb;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
      --text-muted: #666666;
      --border: #e1e4e8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .scheduler-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 550px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 5px;
      font-size: 24px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      outline: none;
    }

    textarea:focus, input[type="url"]:focus, input[type="datetime-local"]:focus {
      border-color: var(--primary);
    }

    input[type="url"], input[type="datetime-local"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .platform-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 5px;
    }

    .platform-option {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
      transition: background 0.2s;
    }

    .platform-option:hover {
      background-color: #f8f9fa;
    }

    .platform-option input {
      margin-right: 10px;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-submit {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

<div class="scheduler-card">
  <h2>🚀 Social Post Hub</h2>
  <div class="subtitle">Compose and schedule posts across all connected networks simultaneously.</div>
  
  <!-- Post Message Box -->
  <div class="form-group">
    <label for="postText">Your Update</label>
    <textarea id="postText" placeholder="Write your post content here..."></textarea>
  </div>

  <!-- Platform Selection checkboxes -->
  <div class="form-group">
    <label>Target Platforms</label>
    <div class="platform-grid">
      <label class="platform-option">
        <input type="checkbox" value="twitter" class="platform-check"> X / Twitter
      </label>
      <label class="platform-option">
        <input type="checkbox" value="linkedin" class="platform-check"> LinkedIn
      </label>
      <label class="platform-option">
        <input type="checkbox" value="reddit" class="platform-check"> Reddit
      </label>
      <label class="platform-option">
        <input type="checkbox" value="pinterest" class="platform-check"> Pinterest
      </label>
    </div>
  </div>

  <!-- Optional Media Asset Link -->
  <div class="form-group">
    <label for="mediaUrl">Media URL <span style="font-weight: normal; color: var(--text-muted);">(Required for Pinterest)</span></label>
    <input type="url" id="mediaUrl" placeholder="https://example.com">
  </div>

  <!-- Delivery Timestamp Input -->
  <div class="form-group">
    <label for="scheduleTime">Release Schedule Date & Time</label>
    <input type="datetime-local" id="scheduleTime">
  </div>

  <!-- Trigger Button -->
  <button class="btn-submit" onclick="submitPost()">Queue via GitHub Actions</button>
</div>

<script>
  // Set the default schedule time to the current date/time to make testing easier
  window.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    // Offset local timezone difference to correctly fill the input field format
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('scheduleTime').value = now.toISOString().slice(0, 16);
  });

  async function submitPost() {
    const text = document.getElementById('postText').value.trim();
    const mediaUrl = document.getElementById('mediaUrl').value.trim();
    const timeInput = document.getElementById('scheduleTime').value;
    
    // Aggregate targeted checkboxes
    const platforms = Array.from(document.querySelectorAll('.platform-check:checked')).map(el => el.value);
    
    // Core data verification
    if (!text) {
      alert("Please enter some text for your post.");
      return;
    }
    if (platforms.length === 0) {
      alert("Please pick at least one social media channel.");
      return;
    }
    if (!timeInput) {
      alert("Please specify a publication schedule time.");
      return;
    }

    // Determine the active countdown window in seconds
    const targetTime = new Date(timeInput).getTime();
    const currentTime = Date.now();
    const delaySeconds = Math.max(0, Math.floor((targetTime - currentTime) / 1000));

    // Construct the payload matching what the secure proxy API route expects
    const payload = {
      text: text,
      platforms: platforms,
      mediaUrl: mediaUrl,
      delaySeconds: delaySeconds
    };

    try {
      // Direct POST payload to Cloudflare Pages Serverless Function proxy path
      const response = await fetch('/api/schedule', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        alert(`Success! Post successfully handed off. GitHub Actions will process publication in ${delaySeconds} seconds.`);
        
        // Clear composition workspace on successful execution
        document.getElementById('postText').value = '';
        document.getElementById('mediaUrl').value = '';
        document.querySelectorAll('.platform-check').forEach(el => el.checked = false);
      } else {
        const errorMsg = await response.text();
        alert("Error dispatching schedule job: " + errorMsg);
      }
    } catch (error) {
      alert("Network communication failure: " + error.message);
    }
  }
</script>
</body>
</html>
