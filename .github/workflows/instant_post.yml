name: Cross-Post Instantly

on:
  repository_dispatch:
    types: [instant_post]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm init -y
          npm install node-fetch

      - name: Execute Publisher
        env:
          # API Tokens & Configuration Secrets
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_URN: ${{ secrets.LINKEDIN_URN }}
          REDDIT_TOKEN: ${{ secrets.REDDIT_TOKEN }}
          REDDIT_SUBREDDIT: ${{ secrets.REDDIT_SUBREDDIT }}
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          
          # User Data from UI
          POST_TEXT: ${{ github.event.client_payload.text }}
          POST_PLATFORMS: ${{ toJson(github.event.client_payload.platforms) }}
          MEDIA_URL: ${{ github.event.client_payload.media_url }}
        run: node scripts/publish.js
